# Run basic testing of Arkouda
name: Arkouda smoke testing

on:
  workflow_call:
    inputs:
      CHAPEL_CI_IMAGE:
        type: string
        default: ghcr.io/chapel-lang/chapel-github-ci:latest
      arkouda-version:
        required: true
        type: string
  pull_request:
    paths:
      - 'test/studies/arkouda/**'
      - '.github/workflows/arkouda-smoke-test.yml'

permissions:
  contents: read
  packages: read

# Allow only one instance to run on a PR at once, cancelling older runs to save resources.
concurrency:
  group: ${{ github.workflow }}-arkouda-${{ inputs.arkouda-version }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  NIGHTLY_TEST_SETTINGS: true
  ARKOUDA_VERSION_INPUT: ${{ inputs.arkouda-version || 'release' }}
  APT_INSTALL_TIMEOUT_MINS: 20

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  arkouda-smoke-test:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.CHAPEL_CI_IMAGE || 'ghcr.io/chapel-lang/chapel-github-ci:latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    env:
      ARKOUDA_REPO: "Bears-R-Us/arkouda"
      AK_ICONV_VER: 1.19
    timeout-minutes: 90 # usually takes ~45 minutes, double for safety
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          create-symlink: true
          key: ccache-${{ github.job }}
          save: ${{ github.ref == 'refs/heads/main' && env.ARKOUDA_VERSION_INPUT == 'release' }}
      - name: determine version of Arkouda to use
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$ARKOUDA_VERSION_INPUT" == "release" ]]; then
            echo "Using latest release version of Arkouda"
            arkouda_version=$(gh api /repos/Bears-R-Us/arkouda/releases/latest | jq -r '.tag_name')
            if [[ "$arkouda_version" == "v2026.07.15" ]]; then
              # Work around issue in release v2026.07.15, which is fixed in
              # https://github.com/Bears-R-Us/arkouda/pull/5524.
              echo "numpy <= 2.4" > requirements-hack.txt
              echo "AK_PIP_CONSTRAINTS=--constraint $(pwd)/requirements-hack.txt" >> "$GITHUB_ENV"
            elif [[ "$arkouda_version" == "v2026.10.14" ]]; then
              # Work around pandas incompatibility in release v2026.10.14, fixed in
              # https://github.com/Bears-R-Us/arkouda/pull/5537.
              echo "pandas == 3.0.6" > requirements-hack.txt
              echo "AK_PIP_CONSTRAINTS=--constraint $(pwd)/requirements-hack.txt" >> "$GITHUB_ENV"
            fi
          else
            arkouda_version="$ARKOUDA_VERSION_INPUT"
          fi
          echo "Picked Arkouda version: $arkouda_version"

          echo "arkouda_version=$arkouda_version" >> "$GITHUB_ENV"
      - name: checkout Arkouda at ${{ env.arkouda_version }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ARKOUDA_REPO }}
          ref: ${{ env.arkouda_version }}
          path: arkouda
          persist-credentials: false
      - name: set Arkouda env vars
        run: |
          cd arkouda
          {
            echo "ARKOUDA_URL=$(pwd)"
            echo "ARKOUDA_BRANCH=$arkouda_version"
            echo "ARKOUDA_DEP_DIR=$(pwd)/dep"
            echo "ARKOUDA_SKIP_CHECK_DEPS=true"
            echo "ARKOUDA_ZMQ_PATH=/usr"
            echo "ARKOUDA_HDF5_PATH=/usr/lib/$(gcc -print-multiarch)/hdf5/serial"
            echo "ARKOUDA_ARROW_PATH=/usr"
            echo "ARKOUDA_ICONV_PATH=$(pwd)/dep/libiconv-install"
            echo "ARKOUDA_IDN2_PATH=/usr"
            echo "ARKOUDA_SHA=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
      - name: cache Arkouda libiconv
        id: cache-arkouda-iconv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ARKOUDA_ICONV_PATH }}
          key: arkouda-iconv-${{ env.AK_ICONV_VER }}
      - name: install Arkouda iconv (retrying)
        if: steps.cache-arkouda-iconv.outputs.cache-hit != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_seconds: 900
          retry_wait_seconds: 30
          on_retry_command: |
            set -exuo pipefail

            cd arkouda
            git clean -dfx
          command: |
            set -exuo pipefail

            num_procs=$(util/buildRelease/chpl-make-cpu_count)
            cd arkouda
            make -j"$num_procs" install-iconv ${AK_ICONV_VER:+"ICONV_VER=$AK_ICONV_VER"}
      - name: check Arkouda dependencies
        run: |
          pkg-config --print-errors --exists arrow parquet libzmq libidn2
          test -f "$ARKOUDA_HDF5_PATH/include/hdf5_hl.h"
          test -f "$ARKOUDA_HDF5_PATH/lib/libhdf5_hl.so"
          test -f "$ARKOUDA_ICONV_PATH/include/iconv.h"
          test -f "$ARKOUDA_ICONV_PATH/lib/libiconv.so"
      - name: setup Python
        timeout-minutes: ${{ fromJSON(env.APT_INSTALL_TIMEOUT_MINS) }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # pin 3.13, many 3.14 point releases break arkouda and 3.15 isn't supported yet
          python-version: 3.13
      - name: build Chapel and run Arkouda smoke testing
        run: |
          source ./util/cron/common.bash
          source ./util/setchplenv.bash
          export CHPL_TEST_ARKOUDA_PERF=false
          source ./util/cron/common-arkouda.bash

          export NIGHTLY_TEST_SETTINGS=true
          export CHPL_SMOKE_SKIP_DOC=true
          export CHPL_SMOKE_SKIP_MAKE_MASON=true
          export ARKOUDA_SMOKE_TEST=true
          ./util/buildRelease/smokeTest
          make -j"$(util/buildRelease/chpl-make-cpu_count)" test-venv

          start_test test/studies/arkouda/
