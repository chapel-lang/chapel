name: email
on:
  # This workflow is intended to run when a PR is merged into main.
  # Although it is per-PR, triggering on pull_request would not provide access
  # to the required secret for sending emails, and pull_request_target is
  # dangerous. Instead, trigger on the push to main, and find the
  # corresponding PR to gather info from.
  push:
    branches: [ main ]

# Serialize runs of this workflow to ensure emails are sent in the same order
# as merges are done.
concurrency:
  group: ${{ github.workflow }}
  queue: max

permissions:
  contents: read

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  send_email:
    if: github.repository == 'chapel-lang/chapel'
    runs-on: ubuntu-slim
    env:
      EMAIL_BODY_FILENAME: email.md
      GH_TOKEN: ${{ github.token }}
      PR_JSON: pr.json
      DIFF_MAX_LINES: 1000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: .
      - name: generate fallback email body
        run: |
          cat << EOF > "$EMAIL_BODY_FILENAME"
          Failure encountered generating PR merge email for commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

          Run ID: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
      - name: find PR associated with this push and grab info
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_seconds: 60
          retry_wait_seconds: 30
          command: |
            set -exuo pipefail

            pr_number=$(gh pr list --search "$GITHUB_SHA" --state merged --json "number" | jq -r '.[0].number')
            if [ -z "$pr_number" ]; then
              echo "Couldn't find PR corresponding to commit $GITHUB_SHA" | tee -a "$EMAIL_BODY_FILENAME"
              exit 1
            fi

            gh api "/repos/${{ github.repository }}/pulls/$pr_number" | jq '.' | tee "$PR_JSON"
      - name: generate email body from PR info
        run: |
          diff=$(git --no-pager diff --merge-base --name-status --diff-filter=ACDMRT "$(jq -r '.base.sha' "$PR_JSON")" "$(jq -r '.head.sha' "$PR_JSON")")
          # Cut off long diff output, and indent diff lines
          diff=$(echo "$diff" | awk "NR <= $DIFF_MAX_LINES; NR > $DIFF_MAX_LINES { print \"(diff output truncated at $DIFF_MAX_LINES lines)\"; exit }" | sed 's/^/  /')

          cat << EOF > "$EMAIL_BODY_FILENAME"
          Branch: $(jq -r '.head.ref' "$PR_JSON")
          Revision: $(jq -r '.merge_commit_sha' "$PR_JSON")
          Author: $(jq -r '.merged_by.login' "$PR_JSON")
          Link: $(jq -r '.html_url' "$PR_JSON")
          Log Message:
          $(jq -r '.title' "$PR_JSON")

          $(jq -r '.body' "$PR_JSON")

          Compare: $(jq -r '.html_url' "$PR_JSON")/changes

          Diff:
          $diff
          $(jq -r '.diff_url' "$PR_JSON")
          EOF
      - name: archive JSON files from run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: json_files
          path: ./*.json
          retention-days: 5
      - name: print email body
        if: always()
        run: |
          cat "$EMAIL_BODY_FILENAME"
      - name: Send mail
        if: always()
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
           server_address: ${{ secrets.SMTP_PROVIDER }}
           server_port: 465
           secure: true
           username: ${{ secrets.MAIL_USERNAME }}
           password: ${{ secrets.MAIL_PASSWORD }}
           subject: "[Chapel Merge] ${{github.event.pull_request.title}}"
           to: chapel+commits@discoursemail.com
           from: "${{env.AUTHOR}} <chapel_commits@cray.com>"
           body: file://${{ env.EMAIL_BODY_FILENAME }}
