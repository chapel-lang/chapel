name: email
on:
  # This workflow is intended to run when a PR is merged into main.
  # Although it is per-PR, triggering on pull_request would not provide access
  # to the required secret for sending emails, and pull_request_target is
  # dangerous. Instead, trigger on the push to main, and find the
  # corresponding PR to gather info from.
  push:
    branches: [ main ]
  # TODO: remove PR trigger which was just for testing
  pull_request:

# Serialize runs of this workflow to ensure emails are sent in the same order
# as merges are done.
concurrency:
  group: ${{ github.workflow }}
  queue: max

permissions:
  contents: read

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  send_email:
    if: github.repository == 'chapel-lang/chapel'
    runs-on: ubuntu-slim
    env:
      EMAIL_BODY_FILENAME: email.md
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .
      - name: generate fallback email body
        run: |
          cat << EOF > "$EMAIL_BODY_FILENAME"
          Failure encountered generating PR merge email for commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

          Run ID: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
      - name: find PR number associated with this push
        run: |
          pr_number=$(gh pr list --search "0350468ff2228a94ec7bc433c5ee94bddbe2195e" --state merged --json "number" | jq '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "Couldn't find PR corresponding to commit 0350468ff2228a94ec7bc433c5ee94bddbe2195e" | tee -a "$EMAIL_BODY_FILENAME"
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_ENV"
      - name: get info about PR
        run: |
          gh api "/repos/${{ github.repository }}/pulls/$pr_number" | jq '.' | tee pr.json
      - name: Send mail
        if: ${{ ! always() }}
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
           # Required mail server address if not connection_url:
           server_address: ${{ secrets.SMTP_PROVIDER}}
           server_port: 465
           # Optional whether this connection use TLS (default is true if server_port is 465)
           secure: true
           # Optional (recommended): mail server username:
           username:  ${{ secrets.MAIL_USERNAME}}
           # Optional (recommended) mail server password:
           password: ${{secrets.MAIL_PASSWORD}}
           # Required mail subject:
           subject: "[Chapel Merge] ${{github.event.pull_request.title}}"
           # Required recipients' addresses:
           to: chapel+commits@discoursemail.com
           # Required sender (supported formats: see "Supported address formats" below)
           from:  "${{env.AUTHOR}} <chapel_commits@cray.com>"
           body: |

              Branch: ${{github.ref}}
              Revision: ${{ github.event.pull_request.merge_commit_sha }}
              Author: ${{ env.AUTHOR}}
              Link: ${{github.event.pull_request._links.html.href}}
              Log Message:
              ${{env.MERGE}}

              Compare: ${{env.COMPARE_URL}}

              Diff:
                       ${{env.DIFF}}
                       ${{github.event.pull_request.diff_url}}
           # Optional priority: 'high', 'normal' (default) or 'low'
           priority: low
