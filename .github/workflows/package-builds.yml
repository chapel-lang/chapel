name: Build Linux packages

on:
  workflow_call:
    inputs:
      chpl_version:
        required: false
        type: string
        default: ""
      tarball_url:
        required: false
        type: string
        default: ""
      package_version:
        required: false
        type: number
        default: 1

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  define-linux-package-configs:
    runs-on: ubuntu-slim
    outputs:
      distro_configs: ${{ steps.configs.outputs.distro_configs }}
    env:
      PACKAGING_DIR: "util/packaging"
    steps:
      - name: sparse check out ${{ env.PACKAGING_DIR }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ env.PACKAGING_DIR }}
      - name: get list of distros to build for
        id: configs
        run: |
          cd "$PACKAGING_DIR"

          pushd apt
          apt_distro_configs=$(find . -type d -not \( -name test -o -name common \) -mindepth 1 -maxdepth 1 -exec basename {} \; | awk '{ printf "%s%s", sep, "\""$0"\"", sep=", "}')
          popd

          pushd rpm
          rpm_distro_configs=$(find . -type d -not \( -name test -o -name common \) -mindepth 1 -maxdepth 1 -exec basename {} \; | awk '{ printf "%s%s", sep, "\""$0"\"", sep=", "}')
          popd

          echo "distro_configs=[$apt_distro_configs,$rpm_distro_configs]" >> "$GITHUB_OUTPUT"

  build-packaging-tarball:
    if: ${{ inputs.tarball_url == '' }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/chapel-github-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build tarball
        run: |
            export CHPL_VERSION='release'
            export CHPL_GEN_RELEASE_SKIP_DOCS=true
            ./util/cron/create_tarball.bash
      - name: upload tarball as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./tar/*.tar.gz
          name: packaging-tarball
          if-no-files-found: error

  download-packaging-tarball:
    if: ${{ inputs.tarball_url != '' }}
    runs-on: ubuntu-slim
    env:
      tarball_url: ${{ inputs.tarball_url }}
      tarball_filename: 'chapel-release-tarball.tar.gz'
    steps:
      - name: download tarball from URL
        run: |
          wget -O "$tarball_filename" "$tarball_url"
      - name: upload tarball as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./${{ env.tarball_filename }}
          name: packaging-tarball
          if-no-files-found: error

  build-linux-packages:
    needs: [define-linux-package-configs, build-packaging-tarball, download-packaging-tarball]
    if: |
      !cancelled() &&
      needs.define-linux-package-configs.result == 'success' &&
      (needs.build-packaging-tarball.result == 'success' || needs.download-packaging-tarball.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.define-linux-package-configs.outputs.distro_configs) }}
        runner: [ubuntu-26.04, ubuntu-24.04-arm]
    env:
      DISTRO: ${{ matrix.distro }}
      ARCH: ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'x86' }}
      out_dir: "./output"
      CHPL_VERSION: ${{ inputs.chpl_version }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: sparse check out util/
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: util/
      - name: download packaging tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaging-tarball
      - name: build package ${{ env.DISTRO }} for ${{ env.ARCH }}
        timeout-minutes: 120
        run: |
          echo "Building the Chapel Package for: "

          source util/build_configs/functions.bash

          calculated_chpl_version="$(get_src_major_version "$(pwd)").$(get_src_minor_version "$(pwd)").$(get_src_patch_version "$(pwd)")"
          if [[ -z "$CHPL_VERSION" ]]; then
            CHPL_VERSION=$calculated_chpl_version
          elif [[ "$CHPL_VERSION" != "$calculated_chpl_version" ]]; then
            echo "Desired chpl version $CHPL_VERSION does not match source version $calculated_chpl_version"
            exit 1
          fi
          export CHPL_VERSION
          echo "Chapel Version = $CHPL_VERSION"

          export PACKAGE_NAME=chapel
          echo "PACKAGE = $PACKAGE_NAME"

          export PACKAGE_VERSION
          echo "Package Version = $PACKAGE_VERSION"

          export OS=$DISTRO
          echo "OS = $OS"

          CHPL_TARBALL=$(pwd)/$(find . -name "*.tar.gz")
          echo "Latest tarball: $CHPL_TARBALL"
          export CHPL_TARBALL

          PARALLEL=$(util/buildRelease/chpl-make-cpu_count)
          echo "PARALLEL = $PARALLEL"

          ./util/cron/create_release_aptrpm.bash
      - name: copy package to output dir
        run: |
          mkdir "$out_dir"
          find util/packaging/ \( -name "*.deb" -o -name "*.rpm" \) -print -exec cp "{}" "$out_dir" \;
      - name: archive package as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.out_dir }}/*
          archive: false
          if-no-files-found: error
