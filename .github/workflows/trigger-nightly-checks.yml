# Kick off the full suite of checks nightly.
name: Run nightly checks

on:
  schedule:
    - cron: "30 0 * * *"
      timezone: "America/Vancouver"
  workflow_dispatch:

# Ensure we save caches from nightly runs on main, so they can be reused in most
# other workflows. This should be getting set implicitly, just setting it
# explicitly for clarity.
cache-mode: write

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  core-checks:
    uses: $/.github/workflows/core-ci-checks.yml
    secrets:
      WEBSITE_KEY: ${{ secrets.WEBSITE_KEY }}
      WEBSITE_KNOWN_HOSTS: ${{ secrets.WEBSITE_KNOWN_HOSTS }}
      WEBSITE_USER: ${{ secrets.WEBSITE_USER }}
      WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
      WEBSITE_PATH: ${{ secrets.WEBSITE_PATH }}

  extended-checks:
    uses: $/.github/workflows/extended-ci-checks.yml
    secrets:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}

  full-checks:
    uses: $/.github/workflows/full-ci-checks.yml

  send-failure-mail:
    if: github.event_name == 'schedule' && (cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure'))
    # must run on ubuntu-latest so we get a longer timeout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - core-checks
      - extended-checks
      - full-checks
    env:
      GH_TOKEN: ${{ github.token }}
      EMAIL_BODY_FILENAME: email.md
      ADDENDA_DIR: failure-email-addenda
    steps:
      - name: determine date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      # Any job can add details to this email by uploading a
      # failure-email-addendum-${{ job.check_run_id }}.md file
      - name: download failure email addenda
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: failure-email-addendum-*
          merge-multiple: true
          path: ${{ env.ADDENDA_DIR }}
      - name: generate fallback email body
        run: |
          cat << EOF > "$EMAIL_BODY_FILENAME"
          GitHub Actions nightly run failed, and an additional failure was
          encountered in generating a failure mail.

          Run ID: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
      - name: generate email body
        timeout-minutes: 20
        run: |
          # Retry each call on its own so one transient error doesn't redo the others
          gh_retry() {
            local out=$1
            shift
            for delay in 0 15 30 60 120; do
              sleep "$delay"
              if gh "$@" > "$out"; then
                return 0
              fi
              echo "::warning::gh $* failed"
            done
            return 1
          }

          echo "::group::commit.json"
          gh_retry commit.json api "/repos/${{ github.repository }}/commits/${{ github.sha }}"
          jq '.' commit.json
          echo "::endgroup::"
          echo "::group::jobs_raw.json"
          gh_retry jobs_raw.json api --paginate "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100"
          jq '.' jobs_raw.json
          echo "::endgroup::"
          # Combine pages of job results into one array
          echo "::group::jobs_array.json"
          jq '.jobs[]' jobs_raw.json | jq --slurp '.' | tee jobs_array.json
          echo "::endgroup::"

          message=$(jq -r '.commit.message | split("\n")[0]' commit.json)
          num_jobs=$(jq 'length' jobs_array.json)
          jq '[.[] | select(.name != "${{ github.job }}" and (.status != "completed" or (.conclusion != "success" and .conclusion != "skipped")))]' jobs_array.json > failed_jobs.json
          readarray -t failed_job_ids < <(jq '.[].id' failed_jobs.json)

          failed_jobs_text=""
          echo "failed jobs:"
          for id in "${failed_job_ids[@]}"; do
            echo "- $id"
            failed_jobs_text+="$(jq -r --argjson id "$id" '.[] | select(.id == $id) | {html_url, name, first_bad_step: ([.steps[] | select(.conclusion != "success" and .conclusion != "skipped")] | first).name} | "- [\(.name)](\(.html_url)), step: \"\(.first_bad_step)\""' failed_jobs.json)
          "
            addendum="$ADDENDA_DIR/failure-email-addendum-$id.md"
            if [[ -s "$addendum" ]]; then
              # indent so the addendum nests under the job's bullet point
              failed_jobs_text+="
          $(sed 's/^/  /' "$addendum")

          "
            fi
          done

          prs_text="(failed to determine PRs merged since the last nightly run)"
          workflow_file=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          if gh_retry runs.json api "/repos/${{ github.repository }}/actions/workflows/$workflow_file/runs?event=schedule&branch=main&per_page=10" &&
             prev_sha=$(jq -er --argjson n "${{ github.run_number }}" '[.workflow_runs[] | select(.run_number < $n)][0].head_sha' runs.json) &&
             gh_retry compare_raw.json api --paginate "/repos/${{ github.repository }}/compare/$prev_sha...${{ github.sha }}?per_page=100" &&
             jq -s --arg head "${{ github.sha }}" '
               INDEX(.[].commits[]; .sha) as $m
               | [$head | select($m[.]) | recurse($m[.].parents[0].sha; $m[.] != null) | $m[.]]
               | reverse
             ' compare_raw.json > first_parents.json; then
            echo '[]' > prs.json
            since=$(jq -r 'map(.commit.committer.date) | min // empty' first_parents.json)
            if [[ -n "$since" ]]; then
              gh_retry prs.json pr list -R "${{ github.repository }}" --state merged --base main --limit 1000 --search "merged:>=$since" --json number,title,url,mergeCommit ||
                echo '[]' > prs.json
            fi
            jq -r --slurpfile prs prs.json '
              INDEX($prs[0][]; .mergeCommit.oid) as $p
              | .[]
              | if $p[.sha] then $p[.sha] | "- \(.title) ([#\(.number)](\(.url)))"
                else "- \(.commit.message | split("\n")[0]) ([\(.sha[0:11])](\(.html_url)))"
                end
            ' first_parents.json > prs.md
            [[ -s prs.md ]] || echo "- (none)" > prs.md
            prs_text="Since [$prev_sha](https://github.com/${{ github.repository }}/commit/$prev_sha) ([compare](https://github.com/${{ github.repository }}/compare/$prev_sha...${{ github.sha }})):

          $(cat prs.md)"
          else
            echo "::warning::failed to determine PRs merged since the last nightly run"
          fi

          [[ $num_jobs -eq 1 ]] && plural="" || plural="s"

          cat << EOF > "$EMAIL_BODY_FILENAME"
          ### The following GitHub Actions job$plural failed:

          $failed_jobs_text

          ##### PRs merged since the last nightly run:

          $prs_text


          Ran $num_jobs total jobs at commit ${{ github.sha }} "$message".

          ##### GitHub Actions run info:
          - SHA: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - Run ID: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - Run attempt: ${{ github.run_attempt }}
          - Run number: ${{ github.run_number }}
          - Triggering event name: ${{ github.event_name }}
          EOF
      - name: print email body
        if: always()
        run: |
          cat "$EMAIL_BODY_FILENAME"
      - name: send mail
        if: always()
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          # Required mail server address if not connection_url:
          server_address: ${{ secrets.SMTP_PROVIDER }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Chapel GA Tests] ${{ steps.date.outputs.date }}"
          to: ${{ secrets.CHAPEL_BUILD_MAIL_ADDRESS }}
          from: "Chapel Automaton <chapel_commits@cray.com>"
          body: file://${{ env.EMAIL_BODY_FILENAME }}
