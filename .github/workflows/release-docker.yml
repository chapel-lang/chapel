# Assuming there is a SHA-tagged image of the release branch already pushed,
# re-tag and push it with the release version tag.
name: re-tag and push Docker images for release

on:
  workflow_dispatch:
    inputs:
      chpl_version:
        type: string
        required: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash -exuo pipefail {0}
env:
  EXTERNAL_REGISTRY: "docker.io"
  NAMESPACE: "chapel"
  SHA_TAG: ${{ github.sha }}

jobs:
  release-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_name: ["chapel", "chapel-gasnet", "chapel-gasnet-smp"]
    env:
      RELEASE_VERSION: ${{ inputs.chpl_version }}
      IMAGE_NAME: ${{ matrix.image_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - name: check release branch
        run: |
          echo "Pushing release-tagged image for version: $RELEASE_VERSION"

          if [[ "$(tr -dc '.' <<< "$RELEASE_VERSION" | awk '{ print length; }')" -ne 2 ]]; then
            echo "Expected X.Y.Z version string, got: $RELEASE_VERSION"
            exit 1
          fi

          release_ver_no_zero_patch=$RELEASE_VERSION
          read -r major minor patch < <(echo "$RELEASE_VERSION" | ( IFS=".$IFS" ; read -r a b c && echo "$a" "$b" "$c" ))
          if [ "$patch" = "0" ]
          then
            echo "Truncating patch version '$patch' from release $RELEASE_VERSION to determine branch name"
            release_ver_no_zero_patch="$major.$minor"
          fi
          release_branch="release/$release_ver_no_zero_patch"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$release_branch")" ]
          then
            echo "Not on expected release branch $release_branch for version $RELEASE_VERSION, aborting"
            exit 1
          fi
      - name: set vars
        run: |
          IMAGE_NO_TAG="$EXTERNAL_REGISTRY/$NAMESPACE/$IMAGE_NAME"
          {
            echo "IMAGE_NO_TAG=$IMAGE_NO_TAG"
            echo "SHA_TAGGED_IMAGE=$IMAGE_NO_TAG:$SHA_TAG"
            echo "RELEASE_TAGGED_IMAGE=$IMAGE_NO_TAG:$RELEASE_VERSION"
            echo "LATEST_TAGGED_IMAGE=$IMAGE_NO_TAG:latest"
          } >> "$GITHUB_ENV"
      - name: check version reported by chpl in SHA tagged image
        run: |
          chpl_version_output=$(docker run --rm "$SHA_TAGGED_IMAGE" chpl --version)
          chpl_version=$(echo "$container_version_output" | head -n 1 | cut -w -f3)
          if [[ "$chpl_version" != "$RELEASE_VERSION" ]]; then
            echo "chpl version in container ($chpl_version) does not match expected release version ($RELEASE_VERSION)"
            echo "chpl --version output in container:"
            echo "$chpl_version_output"
            exit 1
          fi
      - name: log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PAT }}
      - name: tag and push image for release as '${{ env.RELEASE_VERSION }}' and 'latest'
        run: |
          docker buildx imagetools create -t "$RELEASE_TAGGED_IMAGE" "$SHA_TAGGED_IMAGE"
          docker buildx imagetools create -t "$LATEST_TAGGED_IMAGE" "$SHA_TAGGED_IMAGE"
