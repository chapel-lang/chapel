# Longest-running CI checks which should run less frequently, and need not be
# pre-merge. These are required for our full test coverage of Chapel.
name: Full CI checks

on:
  workflow_call:
    inputs:
      CHAPEL_CI_IMAGE:
        type: string
        default: ghcr.io/chapel-lang/chapel-github-ci:latest

permissions:
  contents: read
  packages: read

env:
  CHPL_NIGHTLY_DO_NOTHING: 1
  NIGHTLY_TEST_SETTINGS: true

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  arkouda-main-smoke-test:
    uses: $/.github/workflows/arkouda-smoke-test.yml
    with:
      arkouda-version: "main"

  portability-tests:
    uses: $/.github/workflows/portability-tests.yml

  test-make-install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          create-symlink: true
          key: ccache-${{ github.job }}
          append-timestamp: false
      - name: run test-make-install-check.bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          ./util/cron/test-make-install-check.bash

  test-mpicc:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/chapel-github-ci:latest
      options: --user chpl-tester
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and Test Chapel with mpicc
        shell: bash
        run: |
          source util/setchplenv.bash
          source util/cron/test-mpicc.bash
          export CHPL_RT_OVERSUBSCRIBED=1

          echo "::group::printchplenv"
          printchplenv --all --internal
          echo "::endgroup::"

          echo "::group::Build Chapel"
          num_procs=$(./util/buildRelease/chpl-make-cpu_count)
          make -j"$num_procs" all test-venv
          echo "::endgroup::"

          echo "::group::Run tests"
          start_test test/release/examples/hello*.chpl test/library/packages/MPI test/users/npadmana/mpi
          echo "::endgroup::"
      - name: Build and Test Chapel with mpicc (GASNet)
        if: always()
        shell: bash
        run: |
          source util/setchplenv.bash
          source util/cron/test-mpicc.gasnet.bash
          export CHPL_RT_OVERSUBSCRIBED=1
          # avoid gasnetrun's '-map-by ppr:1:node', which can't oversubscribe
          # this is a hack to get oversubscription to work, if we ever
          # need to support this for users we should do a proper fix
          export MPIRUN_CMD='mpirun --oversubscribe --bind-to none -mca mpi_yield_when_idle 1 -np %M %P %A MPIRUN_CMD_OK'

          echo "::group::printchplenv"
          printchplenv --all --internal
          echo "::endgroup::"

          echo "::group::Build Chapel"
          num_procs=$(./util/buildRelease/chpl-make-cpu_count)
          make -j"$num_procs" all test-venv
          echo "::endgroup::"

          echo "::group::Run tests"
          start_test test/release/examples/hello*.chpl test/library/packages/MPI test/users/npadmana/mpi
          echo "::endgroup::"

  test-incremental:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/chapel-github-ci:latest
      options: --user chpl-tester
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and Test Chapel with --incremental
        shell: bash
        run: |
          source util/setchplenv.bash
          source util/cron/test-linux64.incr.bash

          echo "::group::printchplenv"
          printchplenv --all --internal
          echo "::endgroup::"

          echo "::group::Build Chapel"
          num_procs=$(./util/buildRelease/chpl-make-cpu_count)
          make -j"$num_procs" all test-venv
          echo "::endgroup::"

          echo "::group::Run tests"
          start_test --parallel "$num_procs" test/release/examples
          echo "::endgroup::"
      - name: Build and Test Chapel with --incremental and --no-local
        if: always()
        shell: bash
        run: |
          source util/setchplenv.bash
          source util/cron/test-no-local.incr.bash

          echo "::group::printchplenv"
          printchplenv --all --internal
          echo "::endgroup::"

          echo "::group::Build Chapel"
          num_procs=$(./util/buildRelease/chpl-make-cpu_count)
          make -j"$num_procs" all test-venv
          echo "::endgroup::"

          echo "::group::Run tests"
          start_test --parallel "$num_procs" test/release/examples
          echo "::endgroup::"

  test-llvm-bundled:
    uses: $/.github/workflows/test-llvm-bundled.yml

  build-linux-packages:
    uses: $/.github/workflows/package-builds.yml

  paratest-linux64-c-backend:
    name: Chapel paratest on linux64 with C backend
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: linux64-c-backend
      cron-script: util/cron/test-c-backend.bash
  paratest-linux64-c-backend-gasnet:
    name: Chapel paratest on linux64 with C backend using GASNet
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: linux64-c-backend-gasnet
      start-test-args: -multilocale-only
      max-jobs: 15
      make-targets: all test-venv mason-deps
      cron-script: util/cron/test-gasnet.c-backend.bash
  paratest-linux64-clang:
    name: Chapel paratest on linux64 using Clang as the host/target compiler
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: linux64-clang
      cron-script: util/cron/test-linux64-clang.bash
  paratest-darwin:
    name: Chapel paratest on darwin
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: darwin
      runner: macos-latest
      use-container: false
      cron-script: util/cron/test-darwin.bash
      pre-build-steps: |
        brew install llvm@22
  paratest-linux64-aarch64:
    name: Chapel paratest on linux64 aarch64
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: linux64-aarch64
      runner: ubuntu-26.04-arm
      cron-script: util/cron/test-linux64.bash
      start-test-args: --futures
      make-targets: all test-venv chpldoc mason protoc-gen-chpl
  paratest-linux64-gasnet-everything-aarch64:
    name: Chapel paratest on linux64 aarch64 with gasnet-everything
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: linux64-aarch64-gasnet-everything
      runner: ubuntu-26.04-arm
      cron-script: util/cron/test-gasnet-everything.bash
      start-test-args: --multilocale-only
      max-jobs: 15
      make-targets: all test-venv mason-deps
  paratest-asan:
    name: Chapel paratest with AddressSanitizer
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: asan
      cron-script: util/cron/test-asan.bash
      timeout-minutes: 360
      pre-build-steps: |
        export CHPL_TEST_TIMEOUT=1200
  paratest-fast:
    name: Chapel paratest with --fast
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: fast
      cron-script: util/cron/test-fast.bash
      start-test-args: -compopts --fast -compopts --ccflags -compopts -Wno-invalid-feature-combination
      make-targets: all test-venv mason-deps
  paratest-gasnet-asan:
    name: Chapel paratest with GASNet and AddressSanitizer
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: gasnet-asan
      cron-script: util/cron/test-gasnet-asan.bash
      start-test-args: -multilocale-only
      max-jobs: 15
      timeout-minutes: 360
      make-targets: all test-venv mason-deps
  paratest-gasnet-fast:
    name: Chapel paratest with GASNet fast segment
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: gasnet-fast
      cron-script: util/cron/test-gasnet-fast.bash
      container-options: --shm-size=8g # required for SEGMENT=fast
      start-test-args: -multilocale-only
      max-jobs: 15
      make-targets: all test-venv mason-deps
  # runners only have 2 real cores, and smp can't oversubscribe
  # so this won't work yet
  # paratest-gasnet-smp:
  #   name: Chapel paratest with GASNet SMP conduit
  #   uses: $/.github/workflows/ga-paratest.yml
  #   with:
  #     configuration: gasnet-fast
  #     cron-script: util/cron/test-gasnet-smp.bash
  #     container-options: --shm-size=8g # required for SEGMENT=fast
  #     test-dirs: test/release/examples
  #     make-targets: all test-venv mason-deps
  paratest-gpu-cpu:
    name: Chapel paratest with CHPL_GPU=cpu
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: gpu-cpu
      cron-script: util/cron/test-gpu-cpu.bash
      test-dirs: test/gpu/native test/users/engin/context test/release/examples
      make-targets: all test-venv mason-deps
  paratest-memleaks:
    name: Chapel paratest with --memLeaks
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: memleaks
      cron-script: util/cron/test-memleaks.bash
      start-test-args: -memleaks
      make-targets: all test-venv mason-deps
  paratest-no-local:
    name: Chapel paratest with --no-local
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: no-local
      cron-script: util/cron/test-no-local.bash
      start-test-args: -compopts --no-local
  paratest-quickstart:
    name: Chapel paratest with quickstart configuration
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: quickstart
      cron-script: util/cron/test-quickstart.bash
      make-targets: all test-venv mason-deps
  paratest-ubsan-clang:
    name: Chapel paratest with UndefinedBehaviorSanitizer (clang)
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: ubsan.clang
      cron-script: util/cron/test-ubsan.clang.bash
      make-targets: all test-venv mason
  paratest-ubsan-gnu:
    name: Chapel paratest with UndefinedBehaviorSanitizer (gnu)
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: ubsan.gnu
      cron-script: util/cron/test-ubsan.gnu.bash
      make-targets: all test-venv mason
  paratest-verify:
    name: Chapel paratest with --verify
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: verify
      cron-script: util/cron/test-verify.bash
      start-test-args: -compopts --verify
      make-targets: all test-venv mason-deps
  paratest-locks-atomics:
    name: Chapel paratest with CHPL_ATOMICS=locks
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: locks-atomics
      cron-script: util/cron/test-linux64-locks-atomics.bash
      make-targets: all test-venv mason-deps
      test-dirs: test/release/examples test/runtime/configMatters test/types/atomic
  paratest-intrinsics-atomics:
    name: Chapel paratest with CHPL_ATOMICS=intrinsics
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: intrinsics-atomics
      cron-script: util/cron/test-linux64-intrinsics-atomics.bash
      make-targets: all test-venv mason-deps
      test-dirs: test/release/examples test/runtime/configMatters test/types/atomic
