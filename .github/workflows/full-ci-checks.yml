# Longest-running CI checks which should run less frequently, and need not be
# pre-merge. These are required for our full test coverage of Chapel.
name: Full CI checks

on:
  workflow_call:
    inputs:
      CHAPEL_CI_IMAGE:
        type: string
        default: ghcr.io/chapel-lang/chapel-github-ci:latest

permissions:
  contents: read
  packages: read

env:
  NIGHTLY_TEST_SETTINGS: true
  APT_NETWORK_CONF: |
    Acquire::Retries "5";
    Acquire::http::Timeout "30";
    Acquire::https::Timeout "30";
    Acquire::ForceIPv4 "true";

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  arkouda-main-smoke-test:
    uses: $/.github/workflows/arkouda-smoke-test.yml
    with:
      arkouda-version: "main"

  define-portability-test-configs:
    runs-on: ubuntu-slim
    outputs:
      apptainer_configs: ${{ steps.configs.outputs.apptainer_configs }}
      vagrant_configs: ${{ steps.configs.outputs.vagrant_configs }}
    env:
      PORTABILITY_TEST_DIR: "util/devel/test/portability"
    steps:
      - name: sparse check out ${{ env.PORTABILITY_TEST_DIR }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ env.PORTABILITY_TEST_DIR }}
      - name: get list of current Apptainer and Vagrant configs
        id: configs
        run: |
          cd ${{ env.PORTABILITY_TEST_DIR }}

          pushd apptainer/current
          apptainer_configs=$(find . -type d -mindepth 1 -maxdepth 1 -exec basename {} \; | awk '{ printf "%s%s", sep, "\""$0"\"", sep=", "}')
          echo "apptainer_configs=[$apptainer_configs]" >> "$GITHUB_OUTPUT"
          popd

          pushd vagrant/current
          vagrant_configs=$(find . -type d -mindepth 1 -maxdepth 1 -exec basename {} \; | awk '{ printf "%s%s", sep, "\""$0"\"", sep=", "}')
          echo "vagrant_configs=[$vagrant_configs]" >> "$GITHUB_OUTPUT"
          popd

  portability-tests-apptainer:
    runs-on: ubuntu-latest
    needs: define-portability-test-configs
    strategy:
      fail-fast: false
      matrix:
        apptainer_config: ${{ fromJSON(needs.define-portability-test-configs.outputs.apptainer_configs) }}
    env:
      APPTAINER_IMAGE: ${{ matrix.apptainer_config }}
      apptainer_dir: ./util/devel/test/portability/apptainer
    steps:
      - name: install Apptainer
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-network <<< "$APT_NETWORK_CONF"

          # add-apt-repository queries Launchpad directly, so apt's retry config doesn't cover it
          max_attempts=5
          for attempt in $(seq "$max_attempts"); do
            sudo timeout 90 add-apt-repository --yes ppa:apptainer/ppa && break
            if [[ "$attempt" -eq "$max_attempts" ]]; then
              exit 1
            fi
            sleep 30
          done
          sudo apt-get update
          sudo apt-get install -y apptainer
      - name: print Apptainer version
        run: |
          apptainer --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set vars to work from correct branch
        run: |
          {
            echo "GIT_REPO_URL=$PWD"
            echo "GIT_COMMIT=${{ github.sha }}"
          } >> "$GITHUB_ENV"
      - name: build Apptainer image for config ${{ env.APPTAINER_IMAGE }} (retrying)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 30
          retry_wait_seconds: 60
          command: |
            set -exuo pipefail

            export APPTAINER_IMAGE
            cd "$apptainer_dir"
            ./image-rebuild.sh
      - name: test Apptainer config ${{ env.APPTAINER_IMAGE }}
        run: |
          MAKEJ="-j$(./util/buildRelease/chpl-make-cpu_count)"
          export MAKEJ

          export APPTAINER_IMAGE
          cd "$apptainer_dir"
          ./chapel-quickstart.sh
          # Default config requires LLVM
          if [[ "$APPTAINER_IMAGE" != *"nollvm" ]]; then
              ./chapel-clean.sh
              ./chapel-default.sh
          fi

  test-make-install-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: run test-make-install-check.bash
      run: |
        ./util/cron/test-make-install-check.bash

  build-linux-packages:
    uses: $/.github/workflows/package-builds.yml

  paratest-linux64-c-backend:
    name: Chapel paratest on linux64 with C backend
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: linux64-c-backend
      cron-script: util/cron/test-c-backend.bash
  paratest-darwin:
    name: Chapel paratest on darwin
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: darwin
      runner: macos-latest
      use-container: false
      cron-script: util/cron/test-darwin.bash
      pre-build-steps: |
        brew install llvm@22
  paratest-asan:
    name: Chapel paratest with AddressSanitizer
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: asan
      cron-script: util/cron/test-asan.bash
      timeout-minutes: 360
      pre-build-steps: |
        export CHPL_TEST_TIMEOUT=1200
  paratest-fast:
    name: Chapel paratest with --fast
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: fast
      cron-script: util/cron/test-fast.bash
      start-test-args: -compopts --fast -compopts --ccflags -compopts -Wno-invalid-feature-combination
      make-targets: all test-venv mason-deps
  paratest-gasnet-asan:
    name: Chapel paratest with GASNet and AddressSanitizer
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: gasnet-asan
      cron-script: util/cron/test-gasnet-asan.bash
      start-test-args: -multilocale-only
      timeout-minutes: 360
      make-targets: all test-venv mason-deps
  paratest-gasnet-fast:
    name: Chapel paratest with GASNet fast segment
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: gasnet-fast
      cron-script: util/cron/test-gasnet-fast.bash
      container-options: --shm-size=8g # required for SEGMENT=fast
      start-test-args: -multilocale-only
      make-targets: all test-venv mason-deps
  # runners only have 2 real cores, and smp can't oversubscribe
  # so this won't work yet
  # paratest-gasnet-smp:
  #   name: Chapel paratest with GASNet SMP conduit
  #   uses: $/.github/workflows/ga-paratest.yml
  #   with:
  #     configuration: gasnet-fast
  #     cron-script: util/cron/test-gasnet-smp.bash
  #     container-options: --shm-size=8g # required for SEGMENT=fast
  #     test-dirs: test/release/examples
  #     make-targets: all test-venv mason-deps
  paratest-gpu-cpu:
    name: Chapel paratest with CHPL_GPU=cpu
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: gpu-cpu
      cron-script: util/cron/test-gpu-cpu.bash
      test-dirs: test/gpu/native test/users/engin/context test/release/examples
      make-targets: all test-venv mason-deps
  paratest-memleaks:
    name: Chapel paratest with --memLeaks
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: memleaks
      cron-script: util/cron/test-memleaks.bash
      start-test-args: -memleaks
      make-targets: all test-venv mason-deps
  paratest-no-local:
    name: Chapel paratest with --no-local
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: no-local
      cron-script: util/cron/test-no-local.bash
      start-test-args: -compopts --no-local
  paratest-quickstart:
    name: Chapel paratest with quickstart configuration
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: quickstart
      cron-script: util/cron/test-quickstart.bash
      make-targets: all test-venv mason-deps
  paratest-ubsan-clang:
    name: Chapel paratest with UndefinedBehaviorSanitizer (clang)
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: ubsan.clang
      cron-script: util/cron/test-ubsan.clang.bash
      make-targets: all test-venv mason
  paratest-ubsan-gnu:
    name: Chapel paratest with UndefinedBehaviorSanitizer (gnu)
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: ubsan.gnu
      cron-script: util/cron/test-ubsan.gnu.bash
      make-targets: all test-venv mason
  paratest-verify:
    name: Chapel paratest with --verify
    uses: $/.github/workflows/ga-paratest.yml
    with:
      configuration: verify
      cron-script: util/cron/test-verify.bash
      start-test-args: -compopts --verify
      make-targets: all test-venv mason-deps
