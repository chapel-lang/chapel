# Longest-running CI checks which should run less frequently, and need not be
# pre-merge. These are required for our full test coverage of Chapel.
name: Full CI checks

on:
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  NIGHTLY_TEST_SETTINGS: true

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  trigger-failure:
    runs-on: ubuntu-slim
    steps:
      - run: exit 1
  also-trigger-failure:
    runs-on: ubuntu-slim
    steps:
      - name: break it
        run: exit 1

  arkouda-main-smoke-test:
    uses: ./.github/workflows/arkouda-smoke-test.yml
    with:
      arkouda-version: "main"

  define-portability-test-configs:
    runs-on: ubuntu-slim
    outputs:
      apptainer_configs: ${{ steps.configs.outputs.apptainer_configs }}
      vagrant_configs: ${{ steps.configs.outputs.vagrant_configs }}
    env:
      PORTABILITY_TEST_DIR: "util/devel/test/portability"
    steps:
      - name: sparse check out ${{ env.PORTABILITY_TEST_DIR }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ env.PORTABILITY_TEST_DIR }}
      - name: get list of current Apptainer and Vagrant configs
        id: configs
        run: |
          cd ${{ env.PORTABILITY_TEST_DIR }}

          pushd apptainer/current
          apptainer_configs=$(find . -type d -mindepth 1 -maxdepth 1 -exec basename {} \; | awk '{ printf "%s%s", sep, "\""$0"\"", sep=", "}')
          echo "apptainer_configs=[$apptainer_configs]" >> "$GITHUB_OUTPUT"
          popd

          pushd vagrant/current
          vagrant_configs=$(find . -type d -mindepth 1 -maxdepth 1 -exec basename {} \; | awk '{ printf "%s%s", sep, "\""$0"\"", sep=", "}')
          echo "vagrant_configs=[$vagrant_configs]" >> "$GITHUB_OUTPUT"
          popd

  portability-tests-apptainer:
    runs-on: ubuntu-latest
    needs: define-portability-test-configs
    strategy:
      fail-fast: false
      matrix:
        apptainer_config: ${{ fromJSON(needs.define-portability-test-configs.outputs.apptainer_configs) }}
    env:
      APPTAINER_IMAGE: ${{ matrix.apptainer_config }}
      apptainer_dir: ./util/devel/test/portability/apptainer
    steps:
      - name: install Apptainer
        timeout-minutes: 10
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt update
          sudo apt install -y apptainer
      - name: print Apptainer version
        run: |
          apptainer --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set vars to work from correct branch
        run: |
          {
            echo "GIT_REPO_URL=$PWD"
            echo "GIT_COMMIT=${{ github.sha }}"
          } >> "$GITHUB_ENV"
      - name: build Apptainer image for config ${{ env.APPTAINER_IMAGE }} (retrying)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 30
          retry_wait_seconds: 60
          command: |
            export APPTAINER_IMAGE
            cd "$apptainer_dir"
            ./image-rebuild.sh
      - name: test Apptainer config ${{ env.APPTAINER_IMAGE }}
        run: |
          MAKEJ="-j$(./util/buildRelease/chpl-make-cpu_count)"
          export MAKEJ

          export APPTAINER_IMAGE
          cd "$apptainer_dir"
          ./chapel-quickstart.sh
          # Default config requires LLVM
          if [[ "$APPTAINER_IMAGE" != *"nollvm" ]]; then
              ./chapel-clean.sh
              ./chapel-default.sh
          fi

  test-make-install-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: run test-make-install-check.bash
      run: |
        ./util/cron/test-make-install-check.bash

  define-linux-package-configs:
    runs-on: ubuntu-slim
    outputs:
      distro_configs: ${{ steps.configs.outputs.distro_configs }}
    env:
      PACKAGING_DIR: "util/packaging"
    steps:
      - name: sparse check out ${{ env.PACKAGING_DIR }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ env.PACKAGING_DIR }}
      - name: get list of distros to build for
        id: configs
        run: |
          cd "$PACKAGING_DIR"

          pushd apt
          apt_distro_configs=$(find . -type d -not \( -name test -o -name common \) -mindepth 1 -maxdepth 1 -exec basename {} \; | awk '{ printf "%s%s", sep, "\""$0"\"", sep=", "}')
          popd

          pushd rpm
          rpm_distro_configs=$(find . -type d -not \( -name test -o -name common \) -mindepth 1 -maxdepth 1 -exec basename {} \; | awk '{ printf "%s%s", sep, "\""$0"\"", sep=", "}')
          popd

          echo "distro_configs=[$apt_distro_configs,$rpm_distro_configs]" >> "$GITHUB_OUTPUT"

  build-packaging-tarball:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/chapel-github-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build tarball
        run: |
            export CHPL_VERSION='release'
            export CHPL_GEN_RELEASE_SKIP_DOCS=true
            ./util/cron/create_tarball.bash
      - name: upload tarball as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./tar/*.tar.gz
          name: packaging-tarball
          if-no-files-found: error

  build-linux-packages:
    needs: [define-linux-package-configs, build-packaging-tarball]
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.define-linux-package-configs.outputs.distro_configs) }}
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      DISTRO: ${{ matrix.distro }}
      ARCH: ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'x86' }}
      out_dir: "./output"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: sparse check out util/
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: util/
      - name: download packaging tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaging-tarball
      - name: build package ${{ env.DISTRO }} for ${{ env.ARCH }}
        timeout-minutes: 90
        run: |
          echo "Building the Chapel Package for: "

          source util/build_configs/functions.bash
          CHPL_VERSION="$(get_src_major_version "$(pwd)").$(get_src_minor_version "$(pwd)").$(get_src_patch_version "$(pwd)")"
          export CHPL_VERSION
          echo "Chapel Version = $CHPL_VERSION"

          export PACKAGE_NAME=chapel
          echo "PACKAGE = $PACKAGE_NAME"

          export PACKAGE_VERSION=1
          echo "Package Version = $PACKAGE_VERSION"

          export OS=$DISTRO
          echo "OS = $OS"

          CHPL_RELEASE_TARBALL=$(find . -name "*.tar.gz")
          CHPL_TARBALL=$(pwd)/$CHPL_RELEASE_TARBALL
          echo "Latest tarball: $CHPL_TARBALL"
          export CHPL_TARBALL

          PARALLEL=$(util/buildRelease/chpl-make-cpu_count)
          echo "PARALLEL = $PARALLEL"

          ./util/cron/create_release_aptrpm.bash
      - name: copy package to output dir
        run: |
          mkdir "$out_dir"
          find util/packaging/ \( -name "*.deb" -o -name "*.rpm" \) -print -exec cp "{}" "$out_dir" \;
      - name: archive package as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.out_dir }}/*
          archive: false
          if-no-files-found: error
