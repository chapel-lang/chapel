name: build release tarball

on:
  workflow_dispatch:
    inputs:
      CHAPEL_CI_IMAGE:
        type: string
        default: ghcr.io/chapel-lang/chapel-github-ci:latest
      chpl_version:
        type: string
        required: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  release-tarball:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.CHAPEL_CI_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    env:
      CHPL_VERSION: ${{ inputs.chpl_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: create release tarball
        run: |
          ./util/cron/create_release_tarball.bash
      - name: archive release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./tar/chapel-${{ env.CHPL_VERSION }}.tar.gz
          archive: false
          if-no-files-found: error
