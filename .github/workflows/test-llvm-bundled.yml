name: Test bundled LLVM

on:
  workflow_call:
  pull_request:
    paths:
      - 'third-party/llvm/**'
      - '.github/workflows/test-llvm-bundled.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  test-llvm-bundled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          create-symlink: true
          key: ccache-${{ github.job }}
          append-timestamp: false
      - name: Compile Chapel and run example tests
        run: |
          source util/setchplenv.bash

          export CHPL_LLVM=bundled
          export CHPL_LAUNCHER=none

          echo "::group::printchplenv"
          printchplenv --all --internal
          echo "::endgroup::"

          echo "::group::Build Chapel"
          num_procs=$(./util/buildRelease/chpl-make-cpu_count)
          make -j"$num_procs" all test-venv spectests
          echo "::endgroup::"

          echo "::group::Run tests"
          start_test --parallel "$num_procs" test/release/examples test/llvm
          echo "::endgroup::"
