name: paratest

on:
  workflow_call:
    inputs:
      configuration:
        description: Unique name for this Chapel configuration
        required: true
        type: string
      pre-build-steps:
        description: Pre-build commands, defaults to nothing
        required: false
        type: string
        default: ""
      cron-script:
        description: Cron script to source before building and running tests
        required: false
        type: string
        default: ""
      build-steps:
        description: Build commands, defaults to building the compiler, test venv, chpldoc, and mason
        required: false
        type: string
        default: |
          num_procs=$(util/buildRelease/chpl-make-cpu_count)
          make -j"$num_procs" DEBUG=0 WARNINGS=1 OPTIMIZE=1 all test-venv chpldoc mason
      start-test-args:
        description: Space-separated arguments to pass to start_test
        required: false
        type: string
        default: ""
      test-dirs:
        description: Space-separated test directories (for example test/types), defaults to all test directories
        required: false
        type: string
        default: ""
      max-parallel:
        description: Maximum number of test jobs to run concurrently
        required: false
        type: number
        default: 20
      timeout-minutes:
        description: Maximum number of minutes each job may run
        required: false
        type: number
        default: 180
      retention-days:
        description: Number of days to retain build and test artifacts
        required: false
        type: number
        default: 7
      runner:
        description: The runner to use for the workflow
        required: false
        type: string
        default: ubuntu-latest
      use-container:
        description: Run build and test jobs in the Chapel CI container
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: paratest-${{ inputs.configuration }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ensure we can source cron scripts with actually running the tests
  CHPL_NIGHTLY_DO_NOTHING: 1
  CHPL_HOME: ${{ github.workspace }}
  PARATEST_RESULTS_DIR: paratest-results
  AGGREGATED_RESULTS_DIR: aggregated-results
  CHAPEL_BUILD_FILES_SLUG: chapel-build-files

# note: no -x, its not actually that useful here and there is plenty of other output
defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  build:
    name: Build Chapel (${{ inputs.configuration }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    container:
      image: ${{ inputs.use-container && format('ghcr.io/{0}/chapel-github-ci:latest', github.repository_owner) || '' }}
      options: --user chpl-tester
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    outputs:
      matrix: ${{ steps.test-directories.outputs.matrix }}
      test-count: ${{ steps.test-directories.outputs.test-count }}
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: build Chapel
        env:
          BUILD_STEPS: ${{ inputs.build-steps }}
          CRON_SCRIPT: ${{ inputs.cron-script }}
          PRE_BUILD_STEPS: ${{ inputs.pre-build-steps }}
        run: |
          rm -f "$RUNNER_TEMP/chapel-build.log" "$RUNNER_TEMP/printchplenv.txt"
          {
            if [[ -n "$PRE_BUILD_STEPS" ]]; then
              echo "$PRE_BUILD_STEPS" > "$RUNNER_TEMP/pre-build-steps.bash"
              # shellcheck source=/dev/null
              source "$RUNNER_TEMP/pre-build-steps.bash"
            fi
            if [[ -n "$CRON_SCRIPT" ]]; then
              # shellcheck source=/dev/null
              source "$CRON_SCRIPT"
            fi

            "$CHPL_HOME/util/printchplenv" --all --internal \
              > "$RUNNER_TEMP/printchplenv.txt"

            echo "$BUILD_STEPS" > "$RUNNER_TEMP/build-steps.bash"
            # shellcheck source=/dev/null
            source "$RUNNER_TEMP/build-steps.bash"
          } 2>&1 | tee "$RUNNER_TEMP/chapel-build.log"
      - name: upload Chapel build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chapel-build-diagnostics-${{ inputs.configuration }}
          path: |
            ${{ runner.temp }}/chapel-build.log
            ${{ runner.temp }}/printchplenv.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - name: package Chapel build
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          # tar up generated files so they can be downloaded by subsequent jobs.
          # these then get overlaid on the source tree later
          git ls-files --others --ignored --exclude-standard -z > "$RUNNER_TEMP/$CHAPEL_BUILD_FILES_SLUG"
          if [[ ! -s "$RUNNER_TEMP/$CHAPEL_BUILD_FILES_SLUG" ]]; then
            echo "No generated build files were found"
            exit 1
          fi
          tar --null --files-from="$RUNNER_TEMP/$CHAPEL_BUILD_FILES_SLUG" \
            -czf "$RUNNER_TEMP/$CHAPEL_BUILD_FILES_SLUG-$CONFIGURATION.tar.gz"
      - name: upload Chapel build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CHAPEL_BUILD_FILES_SLUG }}-${{ inputs.configuration }}.tar.gz
          path: ${{ runner.temp }}/${{ env.CHAPEL_BUILD_FILES_SLUG }}-${{ inputs.configuration }}.tar.gz
          archive: false
          retention-days: ${{ inputs.retention-days }}
      - name: determine test directories
        env:
          TEST_DIRS: ${{ inputs.test-dirs }}
          CRON_SCRIPT: ${{ inputs.cron-script }}
        run: |
          # source cron script before running start_test
          if [[ -n "$CRON_SCRIPT" ]]; then
            # shellcheck source=/dev/null
            source "$CRON_SCRIPT"
          fi

          requested_tests=()
          while read -ra line_tests; do
            requested_tests+=("${line_tests[@]}")
          done <<< "${TEST_DIRS:-$CHPL_HOME/test}"
          "$CHPL_HOME/util/start_test" "${requested_tests[@]}" \
            --clean-only --logfile "$RUNNER_TEMP/cleanlog.txt"

          # clean-only walks the suite without running it.
          # This is more reliable than just using `ls` (it resolves skipifs, notests, etc).
          # Store each matrix job as CSV: directory,start_test flags.
          awk -v home="$CHPL_HOME/" '
            BEGIN {
              # these are well-known slow directories that should be split into multiple jobs
              # however, this results in a massive amount of GA runners, so
              # for now dont actually do that
              # slow_directories["test/functions"] = 1
              # slow_directories["test/classes"] = 1
              # slow_directories["test/types"] = 1
            }
            function relative(path) {
              if (index(path, home) == 1) return substr(path, length(home) + 1)
              return path
            }
            function has_descendant_tests(dir, prefix, child) {
              prefix = dir "/"
              for (child in visited) {
                if (index(child, prefix) == 1 && !(child in no_tests)) return 1
              }
              return 0
            }
            /^\[Working on directory / {
              dir = $0
              sub(/^\[Working on directory /, "", dir)
              sub(/\]$/, "", dir)
              dir = relative(dir)
              visited[dir] = 1
              # For directories well-known to be large, split them into multiple jobs.
              # Still run the directory itself as it may have tests outside the subdirectories.
              if (dir ~ "^test/[^/]+$") {
                flags = (dir in slow_directories) ? "--no-recurse" : ""
                testdirs[dir] = flags
              } else {
                parent = dir
                sub("/[^/]+$", "", parent)
                if (parent in slow_directories) testdirs[dir] = ""
              }
            }
            /^\[No tests in directory / {
              dir = $0
              sub(/^\[No tests in directory /, "", dir)
              sub(/\]$/, "", dir)
              no_tests[relative(dir)] = 1
            }
            END {
              for (dir in testdirs) {
                if (!(dir in no_tests) ||
                    (testdirs[dir] != "--no-recurse" && has_descendant_tests(dir))) {
                  print dir "," testdirs[dir]
                }
              }
            }
          ' "$RUNNER_TEMP/cleanlog.txt" | sort -u > "$RUNNER_TEMP/testdirs.csv"

      - name: create testing matrix
        id: test-directories
        run: |
          if [[ ! -s "$RUNNER_TEMP/testdirs.csv" ]]; then
            echo "No test directories found"
            exit 1
          fi

          test_count=$(($(wc -l < "$RUNNER_TEMP/testdirs.csv")))
          if (( test_count > 256 )); then
            echo "The generated matrix has $test_count jobs; GitHub Actions permits at most 256"
            exit 1
          fi

          matrix=$(python3 -c '
          import csv, json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "testdirs.csv")
          rows = list(csv.reader(open(path, encoding="utf-8", newline="")))
          include = [
            {"id": str(i),
             "dir": row[0],
             "flags": row[1]} for i, row in enumerate(rows) if row
          ]
          print(json.dumps({"include": include}, separators=(",", ":")))
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "test-count=$test_count" >> "$GITHUB_OUTPUT"
          echo "Created $test_count test jobs:"
          cat "$RUNNER_TEMP/testdirs.csv"

  run-tests:
    name: Test ${{ matrix.dir }} (${{ inputs.configuration }})
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    container:
      image: ${{ inputs.use-container && format('ghcr.io/{0}/chapel-github-ci:latest', github.repository_owner) || '' }}
      options: --user chpl-tester
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: download Chapel build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CHAPEL_BUILD_FILES_SLUG }}-${{ inputs.configuration }}.tar.gz
          path: ${{ runner.temp }}/${{ env.CHAPEL_BUILD_FILES_SLUG }}
      - name: Test runner setup
        run: |
          # Some tests assume git has been properly configured, so configure it here for the test runner.
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: run tests
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          CRON_SCRIPT: ${{ inputs.cron-script }}
          PRE_BUILD_STEPS: ${{ inputs.pre-build-steps }}
          START_TEST_ARGS: ${{ inputs.start-test-args }}
          TEST_DIR: ${{ matrix.dir }}
          TEST_FLAGS: ${{ matrix.flags }}
          TEST_ID: ${{ matrix.id }}
        run: |
          if [[ -n "$PRE_BUILD_STEPS" ]]; then
            echo "$PRE_BUILD_STEPS" > "$RUNNER_TEMP/pre-build-steps.bash"
            # shellcheck source=/dev/null
            source "$RUNNER_TEMP/pre-build-steps.bash"
          fi
          if [[ -n "$CRON_SCRIPT" ]]; then
            # shellcheck source=/dev/null
            source "$CRON_SCRIPT"
          fi
          tar -xzf "$RUNNER_TEMP/$CHAPEL_BUILD_FILES_SLUG/$CHAPEL_BUILD_FILES_SLUG-$CONFIGURATION.tar.gz"

          result_dir="$CHPL_HOME/$PARATEST_RESULTS_DIR/$TEST_ID"
          mkdir -p "$result_dir"
          echo "$TEST_DIR" > "$result_dir/directory.txt"

          num_procs=$(util/buildRelease/chpl-make-cpu_count)
          start_test_cmd=("$CHPL_HOME/util/start_test")
          if [[ "$START_TEST_ARGS" =~ [^[:space:]] ]]; then
            read -ra start_test_args <<< "$START_TEST_ARGS"
            start_test_cmd+=("${start_test_args[@]}")
          fi
          if [[ "$TEST_FLAGS" =~ [^[:space:]] ]]; then
            read -ra test_flags <<< "$TEST_FLAGS"
            start_test_cmd+=("${test_flags[@]}")
          fi
          start_test_cmd+=(
            "$TEST_DIR"
            -logfile "$result_dir/results.log"
            --parallel "$num_procs"
          )
          set +e
          "${start_test_cmd[@]}"
          test_status=$?
          set -e

          echo "$test_status" > "$result_dir/status.txt"
          exit "$test_status"
      - name: upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paratest-${{ inputs.configuration }}-${{ matrix.id }}
          path: ${{ env.PARATEST_RESULTS_DIR }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  aggregate-results:
    name: Aggregate results (${{ inputs.configuration }})
    if: ${{ !cancelled() }}
    needs: [build, run-tests]
    runs-on: ubuntu-slim
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: util/test/merge_start_test_log_summary
          sparse-checkout-cone-mode: false
      - name: download test results
        id: download-results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: paratest-${{ inputs.configuration }}-[0-9]*
          merge-multiple: false
          path: ${{ env.PARATEST_RESULTS_DIR }}
      - name: aggregate and report results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CONFIGURATION: ${{ inputs.configuration }}
          EXPECTED_TESTS: ${{ needs.build.outputs.test-count }}
          MATRIX_RESULT: ${{ needs.run-tests.result }}
          SETUP_RESULT: ${{ needs.build.result }}
        run: |
          mkdir -p "$AGGREGATED_RESULTS_DIR" "$PARATEST_RESULTS_DIR"
          rm -f "$AGGREGATED_RESULTS_DIR/results.log"
          find "$PARATEST_RESULTS_DIR" -name results.log -print0 \
            | sort -z \
            | xargs -0 -r cat >> "$AGGREGATED_RESULTS_DIR/results.log"

          mapfile -d '' -t summary_files < <(
            find "$PARATEST_RESULTS_DIR" -name results.log.summary -print0 \
              | sort -z
          )
          summary_count=${#summary_files[@]}
          if (( summary_count > 0 )); then
            for summary_file in "${summary_files[@]}"; do
              relative_path=${summary_file#"$PARATEST_RESULTS_DIR/"}
              destination="$AGGREGATED_RESULTS_DIR/log-summaries/$relative_path"
              mkdir -p "$(dirname "$destination")"
              cp "$summary_file" "$destination"
            done
            "$CHPL_HOME/util/test/merge_start_test_log_summary" \
              --output "$AGGREGATED_RESULTS_DIR/results.log.summary" \
              "${summary_files[@]}"
          fi

          mapfile -t status_files < <(
            find "$PARATEST_RESULTS_DIR" -name status.txt -print | sort
          )
          actual_tests=${#status_files[@]}
          failed_tests=0

          {
            echo "# Chapel paratest: $CONFIGURATION"
            echo
            echo "| Test directory | Result | Summary |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for status_file in "${status_files[@]}"; do
            result_dir=$(dirname "$status_file")
            test_dir=$(cat "$result_dir/directory.txt")
            test_status=$(cat "$status_file")
            summary=$(grep -a '^\[Summary: #Successes' \
              "$result_dir/results.log.summary" | tail -n 1 || true)
            if [[ "$test_status" == "0" ]]; then
              result=pass
            else
              result=fail
              failed_tests=$((failed_tests + 1))
            fi
            echo "| $test_dir | $result | $summary |" >> "$GITHUB_STEP_SUMMARY"
          done

          overall_status=0
          if [[ "$BUILD_RESULT" != "success" || "$SETUP_RESULT" != "success" ||
                "$MATRIX_RESULT" != "success" ]]; then
            overall_status=1
          fi
          if [[ -z "$EXPECTED_TESTS" ||
                "$actual_tests" != "$EXPECTED_TESTS" ||
                "$summary_count" != "$EXPECTED_TESTS" ||
                "$failed_tests" != "0" ]]; then
            overall_status=1
          fi

          {
            echo
            echo "Expected test jobs: ${EXPECTED_TESTS:-unknown}"
            echo "Reported test jobs: $actual_tests"
            echo "Reported test summaries: $summary_count"
            echo "Failed test jobs: $failed_tests"
            if [[ "$overall_status" == "0" ]]; then
              echo "Overall result: PASS"
            else
              echo "Overall result: FAIL"
            fi

            if [ -f "$AGGREGATED_RESULTS_DIR/results.log.summary" ]; then
              echo
              echo "start_test log summary:"
              echo "-----------------------"
              echo '```'
              cat "$AGGREGATED_RESULTS_DIR/results.log.summary"
              echo '```'
            else
              echo "No results.log.summary file found"
            fi

          } | tee "$AGGREGATED_RESULTS_DIR/summary.txt" | tee -a "$GITHUB_STEP_SUMMARY"

          exit "$overall_status"
      - name: upload aggregated results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PARATEST_RESULTS_DIR }}-${{ inputs.configuration }}
          path: ${{ env.AGGREGATED_RESULTS_DIR }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
