name: build-CI-container

# Every newly built image is pushed to a staging tag and must pass the CI checks
# before being promoted to latest. Pre-merge (PR and merge queue) builds happen
# via workflow_call from trigger-pr-checks.yml.
on:
  push:
    branches: [ main ]
    # prevents CI updates throttling normal pushes to main
    # Keep in sync with the docker-sources filter below.
    paths:
      - util/packaging/docker/github-ci/Dockerfile
      - .github/workflows/build-CI-container.yml
  workflow_call:
    outputs:
      ran-checks:
        description: Whether a new image was built and the CI checks were run in it
        value: ${{ jobs.should-build-ci-container.outputs.should-build }}
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 2'

env:
  REGISTRY: ghcr.io
  CHAPEL_CI_IMAGE_REPO: ghcr.io/chapel-lang/chapel-github-ci
  DOCKERFILE: util/packaging/docker/github-ci/Dockerfile

# Serialize runs of this workflow on 'main', to prevent a build from an older
# ref pushing and overriding the results of a concurrently-building newer ref.
# Additionally, cancel in-progress runs in merge queue if the merge group is
# destroyed.
concurrency:
  group: build-CI-container-${{ case(github.ref == 'refs/heads/main', 'main', github.event.merge_group.head_ref || github.sha) }}
  queue: ${{ case(github.ref == 'refs/heads/main', 'max', 'single') }}
  cancel-in-progress: ${{ github.event_name == 'merge_group' }}

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  should-build-ci-container:
    if: ${{ github.event.action != 'destroyed' }}
    runs-on: ubuntu-slim
    outputs:
      should-build: ${{ steps.should-build.outputs.should-build }}
      should-push: ${{ steps.should-build.outputs.should-push }}
      should-promote: ${{ steps.should-build.outputs.should-promote }}
      image: ${{ steps.should-build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .
      - name: Check if relevant paths changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            docker-sources:
              - ${{ env.DOCKERFILE }}
              - '.github/workflows/build-CI-container.yml'
      - name: Output that we should${{ fromJSON(env.SHOULD_BUILD) && ' ' || ' not '}}build the image
        id: should-build
        env:
          SHOULD_BUILD: ${{ fromJSON(steps.changes.outputs.docker-sources) || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
          CAN_PUSH: ${{ github.repository_owner == 'chapel-lang' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          PRE_MERGE: ${{ contains(fromJSON('["pull_request","merge_group"]'), github.event_name) }}
          SHA: ${{ github.sha }}
        run: |
          image="$CHAPEL_CI_IMAGE_REPO:latest"
          should_push=false
          should_promote=false
          if [[ "$SHOULD_BUILD" == "true" ]]; then
            if [[ "$CAN_PUSH" == "true" ]]; then
              image="$CHAPEL_CI_IMAGE_REPO:sha-$SHA"
              should_push=true
              if [[ "$PRE_MERGE" != "true" ]]; then
                should_promote=true
              fi
            else
              echo "::warning::Cannot push the new CI image, so checks will run in $image instead."
            fi
          fi
          {
            echo "should-build=$SHOULD_BUILD"
            echo "should-push=$should_push"
            echo "should-promote=$should_promote"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

  build-test-ci-container:
    needs: should-build-ci-container
    if: ${{ fromJSON(needs.should-build-ci-container.outputs.should-build) }}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'amd64' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ env.ARCH }} Docker Image${{ fromJSON(needs.should-build-ci-container.outputs.should-push) && ', and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ env.DOCKERFILE }}
          platforms: linux/${{ env.ARCH }}
          tags: ${{ needs.should-build-ci-container.outputs.image }}-${{ env.ARCH }}
          push: ${{ fromJSON(needs.should-build-ci-container.outputs.should-push) }}
          cache-from: type=gha,scope=${{ env.ARCH }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope={0},mode=max', env.ARCH) || '' }}
      - name: Run basic image checks
        env:
          IMAGE: ${{ needs.should-build-ci-container.outputs.image }}
        run: |
          docker run --rm -i -v "$PWD:/chapel" -w /chapel "$IMAGE-$ARCH" bash -exuo pipefail <<'EOF'
          source util/quickstart/setchplenv.bash
          printchplenv --all --internal

          chpl_llvm=$(util/chplenv/chpl_llvm.py)
          if [ "$chpl_llvm" != "system" ]; then
            echo "ERROR: expected CHPL_LLVM=system, got $chpl_llvm"
            exit 1
          fi

          latest_llvm=$(util/chplenv/chpl_llvm.py --supported-versions | cut -d, -f1)
          actual_llvm=$(util/chplenv/chpl_llvm.py --llvm-version)
          if [ "$latest_llvm" != "$actual_llvm" ]; then
            echo "ERROR: image LLVM version $actual_llvm does not match latest supported $latest_llvm"
            exit 1
          fi
          EOF

  push-multiarch-ci-container:
    needs: [should-build-ci-container, build-test-ci-container]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        if: ${{ fromJSON(needs.should-build-ci-container.outputs.should-push) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        if: ${{ fromJSON(needs.should-build-ci-container.outputs.should-push) }}
        env:
          IMAGE: ${{ needs.should-build-ci-container.outputs.image }}
        run: |
          docker buildx imagetools create -t "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"

  core-checks:
    needs: [should-build-ci-container, push-multiarch-ci-container]
    uses: $/.github/workflows/core-ci-checks.yml
    with:
      CHAPEL_CI_IMAGE: ${{ needs.should-build-ci-container.outputs.image }}
      publish: false

  extended-checks:
    needs: [should-build-ci-container, push-multiarch-ci-container]
    uses: $/.github/workflows/extended-ci-checks.yml
    with:
      CHAPEL_CI_IMAGE: ${{ needs.should-build-ci-container.outputs.image }}
      publish: false

  full-checks:
    needs: [should-build-ci-container, push-multiarch-ci-container]
    # Disabled for now; remove this to also run the full checks.
    if: false
    uses: $/.github/workflows/full-ci-checks.yml
    with:
      CHAPEL_CI_IMAGE: ${{ needs.should-build-ci-container.outputs.image }}

  promote-ci-container:
    needs: [should-build-ci-container, core-checks, extended-checks, full-checks]
    if: ${{ !cancelled() && needs.should-build-ci-container.outputs.should-promote == 'true' && needs.core-checks.result == 'success' && needs.extended-checks.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.full-checks.result) }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested image as latest
        env:
          IMAGE: ${{ needs.should-build-ci-container.outputs.image }}
        run: |
          for suffix in "" -amd64 -arm64; do
            docker buildx imagetools create -t "$CHAPEL_CI_IMAGE_REPO:latest$suffix" "$IMAGE$suffix"
          done

  ci-container-alert-failure:
    if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-slim
    needs:
      - should-build-ci-container
      - build-test-ci-container
      - push-multiarch-ci-container
      - core-checks
      - extended-checks
      - full-checks
      - promote-ci-container
    steps:
      - name: Fail
        run: |
          echo "A required status check has failed"
          exit 1
