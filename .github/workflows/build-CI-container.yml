name: build-CI-container

env:
  REGISTRY: ghcr.io
  CHAPEL_CI_IMAGE: ghcr.io/chapel-lang/chapel-github-ci:latest
  DOCKERFILE: util/packaging/docker/github-ci/Dockerfile

# Serialize runs of this workflow on 'main', to prevent a build from an older
# ref pushing and overriding the results of a concurrently-building newer ref.
concurrency:
  group: ${{ github.workflow }}-${{ case(github.ref == 'refs/heads/main', 'main', github.sha) }}
  queue: max

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 2'

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  should-build-ci-container:
    runs-on: ubuntu-slim
    outputs:
      should-build: ${{ steps.should-build.outputs.should-build }}
      should-push: ${{ steps.should-build.outputs.should-push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .
      - name: Check if relevant paths changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            docker-sources:
              - ${{ env.DOCKERFILE }}
              - '.github/workflows/build-CI-container.yml'
      - name: Output that we should${{ fromJSON(env.SHOULD_BUILD) && ' ' || ' not '}}build the image
        id: should-build
        env:
          SHOULD_BUILD: ${{ fromJSON(steps.changes.outputs.docker-sources) || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
          SHOULD_PUSH: ${{ github.repository_owner == 'chapel-lang' && contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) }}
        run: |
          echo "should-build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "should-push=$SHOULD_PUSH" >> "$GITHUB_OUTPUT"

  build-ci-container:
    needs: should-build-ci-container
    if: ${{ fromJSON(needs.should-build-ci-container.outputs.should-build) }}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'amd64' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ env.ARCH }} Docker Image, and push if on main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ env.DOCKERFILE }}
          platforms: linux/${{ env.ARCH }}
          tags: ${{ env.CHAPEL_CI_IMAGE }}-${{ env.ARCH }}
          push: ${{ fromJSON(needs.should-build-ci-container.outputs.should-push) }}
          cache-from: type=gha,scope=${{ env.ARCH }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope={0},mode=max', env.ARCH) || '' }}

  validate-ci-container:
    needs: build-ci-container
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'amd64' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Load ${{ env.ARCH }} Docker Image from build cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ env.DOCKERFILE }}
          platforms: linux/${{ env.ARCH }}
          tags: ${{ env.CHAPEL_CI_IMAGE }}-${{ env.ARCH }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ env.ARCH }}
      - name: Run image checks
        run: |
          docker run --rm -i -v "$PWD:/chapel" -w /chapel "$CHAPEL_CI_IMAGE-$ARCH" bash -exuo pipefail <<'EOF'
          source util/quickstart/setchplenv.bash
          printchplenv --all --internal

          chpl_llvm=$(util/chplenv/chpl_llvm.py)
          if [ "$chpl_llvm" != "system" ]; then
            echo "ERROR: expected CHPL_LLVM=system, got $chpl_llvm"
            exit 1
          fi

          latest_llvm=$(util/chplenv/chpl_llvm.py --supported-versions | cut -d, -f1)
          actual_llvm=$(util/chplenv/chpl_llvm.py --llvm-version)
          if [ "$latest_llvm" != "$actual_llvm" ]; then
            echo "ERROR: image LLVM version $actual_llvm does not match latest supported $latest_llvm"
            exit 1
          fi

          make -j"$(util/buildRelease/chpl-make-cpu_count)"
          make check
          EOF

  push-multiarch-ci-container:
    needs: [should-build-ci-container, build-ci-container, validate-ci-container]
    if: ${{ fromJSON(needs.should-build-ci-container.outputs.should-push) }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create -t "$CHAPEL_CI_IMAGE" "$CHAPEL_CI_IMAGE-amd64" "$CHAPEL_CI_IMAGE-arm64"

  ci-container-alert-failure:
    if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-slim
    needs:
      - should-build-ci-container
      - build-ci-container
      - validate-ci-container
      - push-multiarch-ci-container
    steps:
      - name: Fail
        run: |
          echo "A required status check has failed"
          exit 1
