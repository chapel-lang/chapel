name: build-CI-container

env:
  REGISTRY: ghcr.io
  CHAPEL_CI_IMAGE: ghcr.io/chapel-lang/chapel-github-ci:latest
  DOCKERFILE: util/packaging/docker/github-ci/Dockerfile

# Serialize runs of this workflow on 'main', to prevent a build from an older
# ref pushing and overriding the results of a concurrently-building newer ref.
concurrency:
  group: ${{ github.workflow }}-${{ case(github.ref == 'refs/heads/main', 'main', github.sha) }}
  queue: max

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 2'

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  should-build-ci-container:
    runs-on: ubuntu-slim
    outputs:
      should-build: ${{ steps.should-build.outputs.should-build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .
      - name: Check if relevant paths changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            docker-sources:
              - ${{ env.DOCKERFILE }}
              - '.github/workflows/build-CI-container.yml'
      - name: Output that we should${{ env.SHOULD_BUILD && ' ' || ' not '}}build the image
        id: should-build
        env:
          SHOULD_BUILD: ${{ steps.changes.outputs.docker-sources }} == 'true' || contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) }}
        run: |
          echo "should-build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  build-ci-container:
    needs: should-build-ci-container
    if: needs.should-build-ci-container.outputs.should-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker Image, and push if on main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ env.DOCKERFILE }}
          tags: ${{ env.CHAPEL_CI_IMAGE }}
          push: ${{ github.repository_owner == 'chapel-lang' && contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
