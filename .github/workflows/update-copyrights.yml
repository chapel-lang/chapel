name: Update copyright years

on:
  workflow_dispatch: # Dry run only
  schedule:
    - cron: '0 16 * * 1' # Weekly dry run (Monday, UTC)
    - cron: '0 15 1 1 *' # Publish on January 1 (UTC)

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: copyright-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  update:
    if: github.repository == 'chapel-lang/chapel' && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      PUBLISH: ${{ github.event.schedule == '0 15 1 1 *' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Needed to push new branch
      - name: Run copyright updater
        id: update
        run: |
          export CHPL_HOME="$GITHUB_WORKSPACE"
          previous_year=$(sed -n 's/^copyright_year = \([0-9][0-9][0-9][0-9]\)$/\1/p' doc/rst/conf.py)
          this_year=$(date +%Y)
          if [[ "$previous_year" != "$this_year" && "$previous_year" != "$((this_year - 1))" ]]; then
            echo "::error::Unexpected copyright year in doc/rst/conf.py: $previous_year"
            exit 1
          fi

          if [[ "$PUBLISH" == 'true' && "$previous_year" == "$this_year" ]]; then
            echo "Copyrights are already up to date for $this_year."
            exit 0
          fi

          target_year=$((previous_year + 1))
          if [[ "$PUBLISH" == 'true' ]]; then
            util/test/updateCopyrights.bash "$previous_year" "$target_year"
          else
            util/test/updateCopyrights.bash --dry-run "$previous_year" "$target_year"
          fi
          if ! grep -Fxq "copyright_year = $target_year" doc/rst/conf.py; then
            echo "::error::The updater did not set doc/rst/conf.py to $target_year"
            exit 1
          fi
          git diff --stat
          echo "year=$target_year" >> "$GITHUB_OUTPUT"

      - name: Open copyright update pull request
        if: env.PUBLISH == 'true' && steps.update.outputs.year != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          YEAR: ${{ steps.update.outputs.year }}
        run: |
          branch="automation/copyright-$YEAR"
          title="Update copyright years for $YEAR"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          remote_branch=$(git ls-remote --heads origin "refs/heads/$branch")
          if [[ -n "$remote_branch" ]]; then
            existing_pr=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --json url --jq '.[0].url // empty')
            if [[ -n "$existing_pr" ]]; then
              existing_patch=$(gh pr diff "$existing_pr" --color never | git patch-id --verbatim)
              generated_patch=$(git diff --no-color HEAD | git patch-id --verbatim)
              if [[ "$existing_patch" != "$generated_patch" ]]; then
                gh pr comment "$existing_pr" \
                  --body "The update generated by [this workflow run]($run_url) differs from this PR. Please review."
              fi
              exit 0
            fi

            # Reuse a branch left by a failed PR creation only if its contents match.
            git fetch --depth=1 origin "refs/heads/$branch"
            git diff --exit-code FETCH_HEAD --
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "$title" --signoff
            git push origin "HEAD:refs/heads/$branch"
          fi

          gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$title" \
            --assignee jabraham17 \
            --body "Generated by [this workflow run]($run_url) using \`util/test/updateCopyrights.bash\`."

      - name: Report workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Automated copyright update failed"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number,title |
            jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" \
              --body "The [copyright update workflow failed again]($run_url). See the run logs for details."
          else
            gh issue create --title "$title" \
              --body "The [copyright update workflow run]($run_url) failed. See the run logs for details."
          fi
