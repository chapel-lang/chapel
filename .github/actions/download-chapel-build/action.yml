name: Download Chapel build
description: Download a Chapel build uploaded by upload-chapel-build and overlay it on the checked out source tree

inputs:
  name:
    description: Artifact name (without the .tar.gz extension)
    required: true

runs:
  using: composite
  steps:
    - name: download Chapel build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}.tar.gz
        path: ${{ runner.temp }}/${{ inputs.name }}
    - name: unpack Chapel build
      shell: bash -euo pipefail {0}
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
      run: |
        tar -xzf "$RUNNER_TEMP/$ARTIFACT_NAME/$ARTIFACT_NAME.tar.gz"
