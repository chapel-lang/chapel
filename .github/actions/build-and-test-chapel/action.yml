name: Build and test Chapel
description: Set up the Chapel environment, build Chapel, and run start_test in a single shell

inputs:
  shell:
    description: Shell command for the build and test step, including the {0} script placeholder
    required: false
    default: "bash -exuo pipefail {0}"
  setup:
    description: >-
      Bash commands to run after sourcing util/setchplenv.bash, e.g. to source a
      util/cron script or export CHPL_* variables. `$num_procs` is available.
    required: false
    default: ""
  make-targets:
    description: Space separated make targets (and variable assignments) to build
    required: false
    default: "all test-venv spectests"
  test-paths:
    description: Space separated test files/directories for start_test (globs are expanded)
    required: false
    default: "test/release/examples"
  start-test-args:
    description: Extra space separated arguments for start_test
    required: false
    default: ""
  parallel:
    description: Whether to pass `--parallel <num_procs>` to start_test
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: build and test Chapel
      id: build-and-test
      shell: ${{ inputs.shell }}
      env:
        CI_SETUP: ${{ inputs.setup }}
        CI_MAKE_TARGETS: ${{ inputs.make-targets }}
        CI_TEST_PATHS: ${{ inputs.test-paths }}
        CI_START_TEST_ARGS: ${{ inputs.start-test-args }}
        CI_PARALLEL: ${{ inputs.parallel }}
        CHPL_NIGHTLY_DO_NOTHING: 1
      run: |
        failures=.build-and-test-chapel-failures.txt
        rm -f .build-and-test-chapel.log .build-and-test-chapel.log.summary \
          "$failures"

        echo "::group::set environment"
        source util/setchplenv.bash
        num_procs=$(./util/buildRelease/chpl-make-cpu_count)
        eval "$CI_SETUP"
        echo "::endgroup::"

        echo "::group::printchplenv"
        printchplenv --all --internal
        echo "::endgroup::"

        echo "::group::Build Chapel"
        build_status=0
        # shellcheck disable=SC2086 # intentionally word split
        make -j"$num_procs" $CI_MAKE_TARGETS || build_status=$?
        echo "::endgroup::"
        if [[ $build_status -ne 0 ]]; then
          message="Chapel build failed (exit code $build_status); tests were not run."
          echo "::error::$message"
          printf '%s\n' "$message" > "$failures"
          exit "$build_status"
        fi

        echo "::group::Run tests"
        parallel_args=""
        if [[ "$CI_PARALLEL" == "true" ]]; then
          parallel_args="--parallel $num_procs"
        fi
        log_args=(--logfile .build-and-test-chapel.log)
        test_status=0
        # shellcheck disable=SC2086 # intentionally word split and glob expanded
        start_test $parallel_args $CI_START_TEST_ARGS "${log_args[@]}" $CI_TEST_PATHS \
          || test_status=$?
        echo "::endgroup::"

        if [[ $test_status -ne 0 ]]; then
          message="Chapel tests failed (exit code $test_status)."
          echo "::error::$message"
          printf '%s\n' "$message" >> "$failures"
        fi

        if [[ -f .build-and-test-chapel.log ]]; then
          util/test/print_start_test_log_failures .build-and-test-chapel.log > "$failures"
          if [[ -s "$failures" ]]; then
            echo "::group::Output of failed tests"
            cat "$failures"
            echo "::endgroup::"
          fi
        fi
        exit "$test_status"
    - name: add failures to email addendum
      id: email-addendum
      if: ${{ !cancelled() && inputs.email-summary == 'true' }}
      shell: bash -euo pipefail {0}
      env:
        FAILURE_EMAIL_ADDENDUM: ${{ runner.temp }}/failure-email-addendum-${{ job.check_run_id }}.md
      run: |
        failures=.build-and-test-chapel-failures.txt

        if [[ -s "$failures" ]]; then
          if [[ -s "$FAILURE_EMAIL_ADDENDUM" ]]; then
            echo >> "$FAILURE_EMAIL_ADDENDUM"
          fi
          {
            echo "Failure details:"
            echo '````'
            cat "$failures"
            echo
            echo '````'
          } >> "$FAILURE_EMAIL_ADDENDUM"
        fi
        if [[ -s "$FAILURE_EMAIL_ADDENDUM" ]]; then
          echo "has-addendum=true" >> "$GITHUB_OUTPUT"
        fi
    - name: upload failure email addendum
      if: ${{ !cancelled() && steps.email-addendum.outputs.has-addendum == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: failure-email-addendum-${{ job.check_run_id }}
        path: ${{ runner.temp }}/failure-email-addendum-${{ job.check_run_id }}.md
        overwrite: true
        if-no-files-found: error
        retention-days: 3
